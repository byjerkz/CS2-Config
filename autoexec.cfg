// =====================================================
// 🚀 CS2 PRO LOW LATENCY CONFIG v4.2
// 👨‍💻 by.jkz
// 🎯 CS2 Compétitif / FACEIT / Low Latency
// 📅 15 Octobre 2026
// =====================================================
// Setup : 800 DPI / 2000Hz / sens 1.25 / eDPI 1000
// Réseau : Filaire / rate 786432 / buffer 1
// Vidéo  : 1080x1080 1:1 / Plein écran / 120Hz
// =====================================================


// =====================================================
// 🔫 VIEWMODEL
// =====================================================

viewmodel_presetpos 2                 // Position compétitive
viewmodel_fov 68                      // FOV viewmodel
viewmodel_offset_x 2.5                // Décale arme droite
viewmodel_offset_y 0                  // Position avant/arrière
viewmodel_offset_z -1.5               // Abaisse légèrement l'arme

// =====================================================
// 🖥️ VISIBILITÉ / HUD
// =====================================================

r_show_build_info 0                   // Cache infos build Valve
r_fullscreen_gamma 2.2                // Gamma standard sRGB
r_drawtracers_firstperson 1           // Traçantes des tirs
r_drawparticles false                 // Particules désactivées (perf)
func_break_max_pieces 0               // Moins de débris physiques
violence_hblood 0                     // Désactive sang humain
violence_ablood 0                     // Désactive sang alien

cl_crosshair_friendly_warning 0       // Désactive avertissement allié
cl_autohelp 0                         // Désactive aides débutants
cl_hide_avatar_images 1               // Cache avatars
cl_allow_animated_avatars false       // Désactive avatars animés

cl_hud_color 7                        // Couleur HUD Cyan/Aqua
hud_scaling 0.9                       // Taille HUD
safezonex "0.90"                      // Position HUD horizontal
safezoney "0.90"                      // Position HUD vertical
fov_desired 90                        // FOV max

cl_teamid_overhead_mode "2"           // Affiche équipements alliés
cl_showloadout "1"                    // Affiche inventaire permanent
cl_use_opens_buy_menu "0"             // Désactive achat avec USE
cl_silencer_mode "0"                  // Retire silencieux clic droit

cl_radar_always_centered 1            // Toujours centré sur le joueur
cl_radar_scale "0.4"                  // Zoom radar
cl_hud_radar_scale 1.2                // Taille radar
cl_radar_icon_scale_min 0.6           // Taille min icônes radar
cl_radar_rotate 1                     // Radar tourne avec le joueur

cl_hud_telemetry_frametime_show 2     // Affiche frametime
cl_hud_telemetry_net_misdelivery_show 2 // Affiche perte paquets


// =====================================================
// 🎧 AUDIO TRYHARD
// =====================================================

volume "0.36"                         // Volume général
snd_headphone_eq "1"                  // Désactive EQ casque Valve
snd_spatialize_lerp "0.8"             // Spatialisation son optimisée
snd_mixahead "0.011"                  // Latence audio minimale
snd_front_headphone_position 90       // Son frontal plus précis
snd_tensecondwarning_volume "0.05"    // Warning bombe (faible mais présent)
snd_menumusic_volume "0"              // Coupe musique menu
snd_mapobjective_volume "0"           // Coupe sons objectifs
snd_deathcamera_volume "0"            // Coupe son caméra mort
snd_mvp_volume "0"                    // Coupe musique MVP
snd_roundaction_volume "0"            // Coupe musiques d'action
snd_roundend_volume "0"               // Coupe musique fin de round
snd_roundstart_volume "0"             // Coupe musique début de round
snd_voipvolume "0.3"                  // Volume vocal mates


// =====================================================
// ⚡ PERFORMANCE / RÉSEAU
// =====================================================

fps_max 240                           // Cap FPS (adapter selon Hz écran)

engine_no_focus_sleep 0               // Pas de ralentissement hors focus
engine_low_latency_sleep_after_client_tick true // Low latency mode

rate 786432                           // Débit réseau max CS2
cl_net_buffer_ticks 1                 // Buffer réseau filaire (2 si Wi-Fi)
cl_interp_ratio 1                     // Interpolation minimale (filaire)
cl_interp 0                           // CS2 calcule automatiquement

mm_dedicated_search_maxping 25        // Ping max serveurs

vprof_off                             // Désactive profiler Valve


// =====================================================
// 🖱️ SOURIS
// =====================================================

sensitivity 1.25                      // Sensibilité (800 DPI = eDPI 1000)
m_pitch 0.022                         // Sensibilité verticale standard
m_yaw 0.022                           // Sensibilité horizontale standard
zoom_sensitivity_ratio 1              // Ratio zoom identique


// =====================================================
// ⌨️ BINDS
// =====================================================

// 🔄 Recharge config
bind "P" "exec autoexec"

// 🎯 Spray control — crosshair recoil ON pendant le tir
alias "+spray" "+attack; cl_crosshair_recoil true"
alias "-spray" "-attack; cl_crosshair_recoil false"
bind "MOUSE1" "+spray"

// 🗑️ Drop arme secondaire (SHIFT)
alias +dropsec "slot2"
alias -dropsec "drop"
bind "SHIFT" "+dropsec"

// 💣 Drop bombe (G)
alias +dropbomb "slot5"
alias -dropbomb "drop"
bind "G" "+dropbomb"

// 🔫 Slots nades
bind "1" "slot6"                      // HE grenade
bind "2" "slot7"                      // Flashbang
bind "3" "slot9"                      // Smoke
bind "4" "slot8"                      // Molotov/Incendiaire
bind "5" "slot10"                     // Decoy

// 🎮 Mouvements / Actions
bind "SPACE" "+jump"
bind "CTRL" "slot5"                   // Équiper bombe
bind "MOUSE4" "+duck"                 // Accroupi
bind "MOUSE5" "+sprint"               // Sprint
bind "MOUSE2" "+attack2"              // Tir secondaire
bind "MOUSE3" "slot4"                 // Slot 4

// 🔪 Armes / Équipements
bind "E" "slot3"                      // Couteau
bind "F" "+use"                       // Use / Ramasser
bind "Q" "drop"                       // Jeter arme

// 🎵 Molette
bind "MWHEELUP" "slot1"               // Arme principale
bind "MWHEELDOWN" "slot2"             // Arme secondaire

// 💬 Communication
bind "X" "+voicerecord"               // Push to talk
bind "T" "messagemode2"               // Chat équipe
bind "ENTER" "messagemode"            // Chat global
bind "C" "radio1"                     // Radio 1

// 🔇 Toggle mute all (sauf amis/party)
alias mute_on "cl_mute_all_but_friends_and_party 1; alias toggle_mute mute_off"
alias mute_off "cl_mute_all_but_friends_and_party 0; alias toggle_mute mute_on"
alias toggle_mute "mute_on"
bind "Z" "toggle_mute"

// ⚙️ Système
bind "`" "toggleconsole"              // Console


// =====================================================
// ✅ CONFIRMATION CHARGEMENT
// =====================================================

echo ""
echo "###############################################################"
echo "#                                                             #"
echo "#        CS2 PRO LOW LATENCY CONFIG v4.2 - LOADED             #"
echo "#                       by.jkz                                #"
echo "#                                                             #"
echo "#   ✅ Viewmodel    : Competitif (FOV 68)                      #"
echo "#   ✅ HUD          : Cyan/Aqua / Scaling 0.9 / FOV 90         #"
echo "#   ✅ Audio        : Tryhard - musiques off                   #"
echo "#   ✅ Radar        : Centre joueur / Scale 0.4                #"
echo "#   ✅ Performance  : FPS 240 / Low Latency                    #"
echo "#   ✅ Reseau       : Filaire / rate 786432 / buffer 1         #"
echo "#   ✅ Ping max     : 25ms                                     #"
echo "#   ✅ Souris       : sens 1.25 / 800 DPI / eDPI 1000          #"
echo "#   ✅ Spray        : Crosshair recoil ON (hold clic)          #"
echo "#   ✅ Visibilite   : Debris physiques OFF                     #"
echo "#                                                             #"
echo "#   ⛔ Si Wi-Fi     : cl_net_buffer_ticks 1 -> 2               #"
echo "#   ⛔ FPS max      : adapter selon Hz de ton ecran            #"
echo "#                                                             #"
echo "###############################################################"
echo ""
echo "  🚀 Launch Options Steam :"
echo "  -novid +fps_max 240 +exec autoexec.cfg"
echo "  -allow_third_party_software -nojoy -noforcemaccel -noforcemparms"
echo ""
